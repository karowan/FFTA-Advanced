name: Build release ZIP

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag with a draft release and accepted BPS asset
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  release:
    if: github.ref_type == 'tag' && github.ref_name == inputs.tag
    runs-on: windows-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ inputs.tag }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12.10'
      - name: Audit exact release source
        run: |
          python scripts/audit-public-source.py --require-private-paths-clean
          if ($LASTEXITCODE) { throw 'Source audit failed' }
          python scripts/check-git-content.py
          if ($LASTEXITCODE) { throw 'Asset guard failed' }
          python scripts/test-git-content.py
          if ($LASTEXITCODE) { throw 'Guard tests failed' }
          python scripts/test-source-cleanup.py
          if ($LASTEXITCODE) { throw 'Source tests failed' }
          python scripts/test-ci-release.py
          if ($LASTEXITCODE) { throw 'Packaging tests failed' }
      - name: Require a draft release and fetch the accepted patch
        run: |
          $draft = gh release view $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY --json isDraft --jq .isDraft
          if ($LASTEXITCODE -or $draft -ne 'true') { throw 'Use a draft release; published assets are immutable.' }
          gh release download $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY --pattern FFTA_Expansion.bps --dir build/ci-input
          if ($LASTEXITCODE) { throw 'Accepted patch download failed' }
      - name: Build deterministic player ZIP
        run: python scripts/ci_release.py --patch build/ci-input/FFTA_Expansion.bps --tag $env:RELEASE_TAG
      - name: Upload and publish the verified release
        run: |
          gh release upload $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY "build/ci-release/FFTA-Advanced-$env:RELEASE_TAG.zip" build/ci-release/SHA256SUMS.txt --clobber
          if ($LASTEXITCODE) { throw 'Release upload failed' }
          gh release edit $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY --draft=false --title "FFTA Advanced $env:RELEASE_TAG" --notes-file release/NOTES.md --latest
          if ($LASTEXITCODE) { throw 'Release publication failed' }
